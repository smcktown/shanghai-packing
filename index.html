:root {

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--pearl); }
body {

header {

.bar .filters button.must-f.active { background: var(--must); color: white; }

.person-cat li.buy .box { border-color: var(--buy); }

.person-cat li.lastmin .box { border-color: var(--lastmin); }

[hidden] { display: none !important; }

@media print {
  .bar { position: static; }
  body { background: white; padding: 0.8cm; }
}
</style>

// ---------- RENDER MATRIX VIEW ----------
function renderMatrix() {
  const root = document.getElementById('matrix-view');
  root.innerHTML = '';
  const cats = [...new Set(ITEMS.map(i => i.cat))];
  cats.forEach(cat => {
    const catItems = ITEMS.filter(i => i.cat === cat);
    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `<span>${cat}</span><span class="ct">${catItems.length} item${catItems.length>1?'s':''}</span>`;
    head.dataset.cat = cat;
    root.appendChild(head);

    const wrap = document.createElement('div');
    wrap.style.overflowX = 'auto';
    wrap.style.marginBottom = '0.5rem';

    const table = document.createElement('table');
    table.className = 'matrix';
    let thead = '<thead><tr><th class="col-check"></th><th class="col-item">Item</th>';
    PEOPLE.forEach(p => thead += `<th>${p.short}</th>`);
    thead += '<th class="col-must"></th></tr></thead>';
    let tbody = '<tbody>';
    catItems.forEach(it => {
      const classes = ['matrix-row'];
      if (it.tag === 'buy') classes.push('buy');
      if (it.must) classes.push('must');
      if (it.lastmin) classes.push('lastmin');
      tbody += `<tr class="${classes.join(' ')}" data-id="${it.id}">`;
      tbody += `<td class="col-check" data-mark-all="1"><div class="box"></div></td>`;
      tbody += `<td class="col-item">${it.name}${it.note?`<span class="note">${it.note}</span>`:''}</td>`;
      PEOPLE.forEach(p => {
        const v = it.qty[p.key];
        if (v === undefined || v === null || v === 0) {
          tbody += `<td class="empty">·</td>`;
        } else {
          const cls = p.key === 'family' ? 'qty qty-fam' : 'qty';
          tbody += `<td class="${cls}" data-cell="${p.key}">${v}</td>`;
        }
      });
      tbody += `<td class="col-must"></td>`;
      tbody += `</tr>`;
    });
    tbody += '</tbody>';
    table.innerHTML = thead + tbody;
    wrap.appendChild(table);
    root.appendChild(wrap);
  });
}

// ---------- RENDER PERSON VIEW ----------
let currentPerson = 'family';
function renderPersonTabs() {
  const tabs = document.getElementById('person-tabs');
  tabs.innerHTML = '';
  PEOPLE.forEach(p => {
    const personItems = ITEMS.filter(i => {
      const v = i.qty[p.key];
      return v !== undefined && v !== null && v !== 0;
    });
    const total = personItems.length;
    const packed = personItems.filter(i => isCellDone(i.id, p.key)).length;
    const btn = document.createElement('button');
    btn.dataset.p = p.key;
    btn.textContent = `${p.label} ${packed}/${total}`;
    if (p.key === currentPerson) btn.classList.add('active');
    if (packed === total && total > 0) btn.classList.add('all-packed');
    btn.addEventListener('click', () => {
      currentPerson = p.key;
      renderPersonTabs();
      renderPersonList();
    });
    tabs.appendChild(btn);
  });
}

function renderPersonList() {
  const root = document.getElementById('person-list');
  root.innerHTML = '';
  const personItems = ITEMS.filter(i => {
    const v = i.qty[currentPerson];
    return v !== undefined && v !== null && v !== 0;
  });
  const cats = [...new Set(personItems.map(i => i.cat))];
  cats.forEach(cat => {
    const catItems = personItems.filter(i => i.cat === cat);
    const sec = document.createElement('div');
    sec.className = 'person-cat';
    sec.dataset.cat = cat;
    let html = `<div class="ph"><span>${cat}</span><span class="pc">${catItems.length} item${catItems.length>1?'s':''}</span></div><ul>`;
    catItems.forEach(it => {
      const classes = ['person-row'];
      if (it.tag === 'buy') classes.push('buy');
      if (it.must) classes.push('must');
      if (it.lastmin) classes.push('lastmin');
      const v = it.qty[currentPerson];
      const badges = `${it.tag === 'buy' ? '<span class="badge badge-buy">to buy</span>' : ''}${it.must ? '<span class="badge badge-must">⭐ must</span>' : ''}${it.lastmin ? '<span class="badge badge-lastmin">⏰ last min</span>' : ''}`;
      html += `<li class="${classes.join(' ')}" data-id="${it.id}">`;
      html += `<div class="box"></div>`;
      html += `<div class="text"><span class="qty">${v} ×</span>${it.name}${badges}</div>`;
      html += `</li>`;
    });
    html += '</ul>';
    sec.innerHTML = html;
    root.appendChild(sec);
  });
  applyState();
  applyFilter();
}

// ---------- STATE / INTERACTION ----------
function getState() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch { return {}; } }
function setState(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch {} }

function cellsForItem(item) {
  return Object.keys(item.qty).filter(pk => {
    const v = item.qty[pk];
    return v !== undefined && v !== null && v !== 0;
  });
}

function isCellDone(itemId, pk) {
  const s = getState();
  return !!(s[itemId] && s[itemId][pk]);
}

function itemRowStatus(item) {
  // 'none' | 'partial' | 'all'
  const cells = cellsForItem(item);
  if (cells.length === 0) return 'none';
  const doneCount = cells.filter(pk => isCellDone(item.id, pk)).length;
  if (doneCount === 0) return 'none';
  if (doneCount === cells.length) return 'all';
  return 'partial';
}

function toggleCell(itemId, pk) {
  const s = getState();
  if (!s[itemId]) s[itemId] = {};
  s[itemId][pk] = !s[itemId][pk];
  if (!s[itemId][pk]) delete s[itemId][pk];
  if (Object.keys(s[itemId]).length === 0) delete s[itemId];
  setState(s);
  applyState();
  applyFilter();
}

function toggleAllForItem(itemId) {
  const item = ITEMS.find(i => i.id === itemId);
  if (!item) return;
  const cells = cellsForItem(item);
  const status = itemRowStatus(item);
  const s = getState();
  if (status === 'all') {
    delete s[itemId];
  } else {
    s[itemId] = {};
    cells.forEach(pk => { s[itemId][pk] = true; });
  }
  setState(s);
  applyState();
  applyFilter();
}

function updateProgress() {
  let total = 0, done = 0;
  ITEMS.forEach(it => {
    const cells = cellsForItem(it);
    total += cells.length;
    cells.forEach(pk => { if (isCellDone(it.id, pk)) done++; });
  });
  const pct = total ? Math.round((done / total) * 100) : 0;
  document.getElementById('pct').textContent = pct + '%';
  document.getElementById('fill').style.width = pct + '%';
}

function applyState() {
  // Matrix: per-cell + per-row visual state
  document.querySelectorAll('#matrix-view tbody tr').forEach(tr => {
    const itemId = tr.dataset.id;
    const item = ITEMS.find(i => i.id === itemId);
    if (!item) return;
    tr.querySelectorAll('td.qty').forEach(td => {
      const pk = td.dataset.cell;
      if (isCellDone(itemId, pk)) td.classList.add('cell-done');
      else td.classList.remove('cell-done');
    });
    const status = itemRowStatus(item);
    tr.classList.toggle('done', status === 'all');
    tr.classList.toggle('partial', status === 'partial');
  });
  // Per-person list: each row reflects (item, currentPerson)
  document.querySelectorAll('.person-cat li').forEach(li => {
    li.classList.toggle('done', isCellDone(li.dataset.id, currentPerson));
  });
  if (document.getElementById('person-tabs')) renderPersonTabs();
  updateProgress();
}

function resetAll() {
  if (!confirm('Reset all checkboxes?')) return;
  localStorage.removeItem(STORE_KEY);
  applyState();
  applyFilter();
}

document.addEventListener('click', (e) => {
  // Matrix: leftmost ✓ column = mark every person on the row
  const markAll = e.target.closest('#matrix-view td[data-mark-all]');
  if (markAll) { toggleAllForItem(markAll.closest('tr').dataset.id); return; }
  // Matrix: tap one person's qty cell
  const cell = e.target.closest('#matrix-view td.qty');
  if (cell) { toggleCell(cell.closest('tr').dataset.id, cell.dataset.cell); return; }
  // Per-person view: tap a row toggles only that person
  const li = e.target.closest('.person-cat li');
  if (li) { toggleCell(li.dataset.id, currentPerson); return; }
});

document.querySelectorAll('.bar button.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    const v = btn.dataset.view;
    document.querySelectorAll('.bar button.tab').forEach(b => b.classList.toggle('active', b === btn));
    document.getElementById('matrix-view').hidden = v !== 'matrix';
    document.getElementById('person-view').hidden = v !== 'person';
    if (v === 'person') { renderPersonList(); }
    applyFilter();
  });
});

let currentFilter = 'all';
function applyFilter() {
  document.querySelectorAll('#matrix-view tbody tr').forEach(tr => {
    const done = tr.classList.contains('done');
    const buy = tr.classList.contains('buy');
    const must = tr.classList.contains('must');
    const lastmin = tr.classList.contains('lastmin');
    let show = true;
    if (currentFilter === 'topack') show = !done;
    else if (currentFilter === 'done') show = done;
    else if (currentFilter === 'buy') show = buy;
    else if (currentFilter === 'must') show = must;
    else if (currentFilter === 'lastmin') show = lastmin;
    tr.hidden = !show;
  });
  document.querySelectorAll('#matrix-view .cat-head').forEach(h => {
    const cat = h.dataset.cat;
    const visible = [...document.querySelectorAll(`#matrix-view tbody tr:not([hidden])`)].some(tr => {
      const item = ITEMS.find(i => i.id === tr.dataset.id);
      return item && item.cat === cat;
    });
    h.hidden = !visible;
    h.nextElementSibling.hidden = !visible;
  });

  document.querySelectorAll('.person-cat li').forEach(li => {
    const done = li.classList.contains('done');
    const buy = li.classList.contains('buy');
    const must = li.classList.contains('must');
    const lastmin = li.classList.contains('lastmin');
    let show = true;
    if (currentFilter === 'topack') show = !done;
    else if (currentFilter === 'done') show = done;
    else if (currentFilter === 'buy') show = buy;
    else if (currentFilter === 'must') show = must;
    else if (currentFilter === 'lastmin') show = lastmin;
    li.hidden = !show;
  });
  document.querySelectorAll('.person-cat').forEach(sec => {
    const visible = sec.querySelectorAll('li:not([hidden])').length;
    sec.hidden = visible === 0;
  });
}

document.querySelectorAll('.bar .filters button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentFilter = btn.dataset.f;
    document.querySelectorAll('.bar .filters button').forEach(b => b.classList.toggle('active', b === btn));
    applyFilter();
  });
});

renderMatrix();
renderPersonTabs();
renderPersonList();
applyState();
